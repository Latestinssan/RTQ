name: Security — invariants, pipeline, audit, QR, attackcraft

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0" # every Sunday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false # security suite never cancels mid-run

jobs:
  invariants:
    name: "12 automated invariants"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the twelve automated security invariants
        run: npx vitest run tests/invariants

  pipeline:
    name: "pipeline + audit (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/security tests/unit

  diagnostics:
    name: "fail-closed diagnostics report"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Print constructible OS backends (explicit, never fake a pass)
        run: npx rtq diagnostics || true
